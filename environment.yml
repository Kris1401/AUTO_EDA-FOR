name: auto-eda-for
channels:
  - conda-forge
dependencies:
  - python=3.11
  # --- core / UI / EDA ---
  - numpy=1.26.*
  - pandas=2.2.*
  - scipy=1.11.*
  - scikit-learn=1.3.*
  - statsmodels=0.14.*
  - streamlit>=1.38
  - plotly>=5.22
  - itables>=2.1
  - pillow>=10.4
  - pyyaml>=6.0
  - python-dotenv>=1.0
  - pydantic>=2.8
  - openpyxl
  # --- models (conda-forge binarki) ---
  - xgboost=2.0.*
  - lightgbm=4.3.*
  # --- explain / tuning ---
  - shap=0.45.*
  - optuna=3.6.*
  # --- PDF (MVP Etap 1) ---
  - camelot-py>=0.11
  - ghostscript
  # --- LLM SDK (conda) ---
  - openai>=1.51
  # --- pip-only dodatki ---
  - pip
  - pip:
      - langfuse>=2.33
      - pdfplumber==0.11.4
      - pypdfium2>=4.20.0
      - pycaret==3.3.*
      - catboost==1.2.*
      - sktime==0.26.0
      - date-a-scientist==0.1.19  # opcjonalne (tryb "Laboratorium" w Data Chat)
      