name: Keep Streamlit Awake

on:
  schedule:
    # Streamlit Community Cloud hibernates apps after 12h without traffic.
    # Ping every 6h to keep a comfortable buffer.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.STREAMLIT_APP_URL || secrets.STREAMLIT_APP_URL }}

    steps:
      - name: Validate URL
        shell: bash
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "::error::Set STREAMLIT_APP_URL as a repository variable or secret in GitHub Actions."
            exit 1
          fi

          if [[ "${APP_URL}" != http://* && "${APP_URL}" != https://* ]]; then
            APP_URL="https://${APP_URL}"
          fi

          echo "APP_URL=${APP_URL}" >> "${GITHUB_ENV}"
          echo "Will ping: ${APP_URL}"

      - name: Ping Streamlit app
        shell: bash
        run: |
          cookie_jar="$(mktemp)"
          trap 'rm -f "${cookie_jar}"' EXIT

          ping_url="${APP_URL%/}/_stcore/health"
          echo "Health URL: ${ping_url}"

          status=""
          curl_exit=0

          for attempt in 1 2 3 4 5 6; do
            echo "Ping attempt ${attempt}/6"

            set +e
            status="$(curl \
              --location \
              --max-redirs 10 \
              --cookie-jar "${cookie_jar}" \
              --cookie "${cookie_jar}" \
              --user-agent "Mozilla/5.0 (GitHub Actions Streamlit keep-awake)" \
              --silent \
              --show-error \
              --output /tmp/streamlit-keep-awake.html \
              --write-out "%{http_code}" \
              --connect-timeout 20 \
              --max-time 60 \
              --retry 2 \
              --retry-delay 10 \
              "${ping_url}")"
            curl_exit="$?"
            set -e

            echo "curl exit: ${curl_exit}; HTTP status: ${status}"

            if [ "${curl_exit}" -eq 0 ] && [ "${status}" -ge 200 ] && [ "${status}" -lt 400 ]; then
              echo "Keep-awake ping completed."
              exit 0
            fi

            sleep 30
          done

          echo "::error::Keep-awake ping failed after retries. curl exit ${curl_exit}, HTTP ${status}."
          exit 1
