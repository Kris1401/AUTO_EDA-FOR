name: Keep Streamlit Awake

on:
  schedule:
    # Streamlit Community Cloud hibernates apps after 12h without traffic.
    # Ping every 6h to keep a comfortable buffer.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://auto-eda-for.streamlit.app

    steps:
      - name: Validate URL
        shell: bash
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "::error::Set APP_URL in this workflow."
            exit 1
          fi

          if [[ "${APP_URL}" != http://* && "${APP_URL}" != https://* ]]; then
            APP_URL="https://${APP_URL}"
          fi

          echo "APP_URL=${APP_URL}" >> "${GITHUB_ENV}"
          echo "Will ping: ${APP_URL}"

      - name: Ping Streamlit app
        shell: bash
        run: |
          cookie_jar="$(mktemp)"
          trap 'rm -f "${cookie_jar}"' EXIT

          health_url="${APP_URL%/}/_stcore/health"
          root_url="${APP_URL%/}/"
          echo "Health URL: ${health_url}"
          echo "Root URL: ${root_url}"

          status=""
          curl_exit=0

          for attempt in 1 2 3 4 5 6; do
            echo "Ping attempt ${attempt}/6"

            set +e
            for ping_url in "${health_url}" "${root_url}"; do
              echo "Trying: ${ping_url}"
              status="$(curl \
                --location \
                --max-redirs 10 \
                --cookie-jar "${cookie_jar}" \
                --cookie "${cookie_jar}" \
                --user-agent "Mozilla/5.0 (GitHub Actions Streamlit keep-awake)" \
                --silent \
                --show-error \
                --output /tmp/streamlit-keep-awake.html \
                --write-out "%{http_code}" \
                --connect-timeout 20 \
                --max-time 90 \
                --retry 2 \
                --retry-delay 10 \
                "${ping_url}")"
              curl_exit="$?"

              echo "curl exit: ${curl_exit}; HTTP status: ${status}"

              if [ "${curl_exit}" -eq 0 ] && [ "${status}" -ge 200 ] && [ "${status}" -lt 400 ]; then
                echo "Keep-awake ping completed."
                exit 0
              fi
            done
            set -e

            sleep 30
          done

          message="Keep-awake ping failed after retries. curl exit ${curl_exit}, HTTP ${status}."
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "::warning::${message} Scheduled keep-awake is best-effort; the next run will try again."
            exit 0
          fi

          echo "::error::${message}"
          exit 1
